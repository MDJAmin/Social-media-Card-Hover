<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <link
      href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css"
      rel="stylesheet"
      integrity="sha384-wvfXpqpZZVQGK6TAh5PVlGOfQNHSoD2xbE+QkPxCAFlNEevoEH3Sl0sibVcOQVnN"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="style.css"
    />
    <link
      rel="shortcut icon"
      href="favicon.svg"
      type="image/x-icon"
    />
    <title>Social Media Card Hover</title>
  </head>
  <body>
    <div class="container">
      <div class="card">
        <div class="face face1">
          <div class="content">
            <div class="icon">
              <i
                class="fa fa-linkedin-square"
                aria-hidden="true"
              ></i>
            </div>
          </div>
        </div>
        <div class="face face2">
          <div class="content">
            <h3>
              <a
                href="#"
                target="_blank"
                >Linkedin</a
              >
            </h3>
            <p>Professional networking.</p>
          </div>
        </div>
      </div>
      <div class="card">
        <div class="face face1">
          <div class="content">
            <div class="icon">
              <i
                class="fa fa-youtube-square"
                aria-hidden="true"
              ></i>
            </div>
          </div>
        </div>
        <div class="face face2">
          <div class="content">
            <h3>
              <a
                href="#"
                target="_blank"
                >Youtube</a
              >
            </h3>
            <p>Video sharing.</p>
          </div>
        </div>
      </div>
      <div class="card">
        <div class="face face1">
          <div class="content">
            <div class="icon">
              <i
                class="fa fa-github-square"
                aria-hidden="true"
              ></i>
            </div>
          </div>
        </div>
        <div class="face face2">
          <div class="content">
            <h3>
              <a
                href="#"
                target="_blank"
                >GitHub</a
              >
            </h3>
            <p>Code collaboration.</p>
          </div>
        </div>
      </div>
    </div>
    <!-- Credit: MDJAmin -->
    <!-- Remove this div if you want to. (also remove the CSS code for this div from style.css) -->
    <div class="MDJAminDiv">
      <a
        class="MDJAmin"
        href="https://github.com/MDJAmin"
        target="_blank"
        >MDJAmin</a
      >
    </div>
  </body>
</html>
